apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datafusionx-commercial.fullname" . }}-worker
  labels:
    {{- include "datafusionx-commercial.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: worker
          image: {{ .Values.image.backend | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: {{ include "datafusionx-commercial.fullname" . }}-config
            - secretRef:
                name: {{ include "datafusionx-commercial.fullname" . }}-secret
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{ if .Values.externalPostgres.enabled }}
                  name: {{ required "externalPostgres.passwordSecret is required when externalPostgres.enabled=true" .Values.externalPostgres.passwordSecret | quote }}
                  key: {{ .Values.externalPostgres.passwordSecretKey | quote }}
                  {{ else }}
                  name: {{ include "datafusionx-commercial.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
                  {{ end }}
            - name: DATABASE_URL
              {{ if .Values.externalPostgres.enabled }}
              value: {{ printf "postgresql+asyncpg://%s:$(POSTGRES_PASSWORD)@%s:%v/%s" (required "externalPostgres.username is required when externalPostgres.enabled=true" .Values.externalPostgres.username) (required "externalPostgres.host is required when externalPostgres.enabled=true" .Values.externalPostgres.host) .Values.externalPostgres.port (required "externalPostgres.database is required when externalPostgres.enabled=true" .Values.externalPostgres.database) | quote }}
              {{ else }}
              value: postgresql+asyncpg://datafusionx:$(POSTGRES_PASSWORD)@{{ include "datafusionx-commercial.fullname" . }}-postgres:5432/datafusionx
              {{ end }}
            - name: REDIS_URL
              value: redis://{{ include "datafusionx-commercial.fullname" . }}-redis:6379/0
          volumeMounts:
            - name: licenses
              mountPath: /app/licenses
      volumes:
        - name: licenses
          persistentVolumeClaim:
            claimName: {{ include "datafusionx-commercial.fullname" . }}-licenses
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datafusionx-commercial.fullname" . }}-cdc-guard
  labels:
    {{- include "datafusionx-commercial.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cdcGuard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: cdc-guard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cdc-guard
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: cdc-guard
          image: {{ .Values.image.backend | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-c", "from app.worker.cdc_guard_worker import main; main()"]
          envFrom:
            - configMapRef:
                name: {{ include "datafusionx-commercial.fullname" . }}-config
            - secretRef:
                name: {{ include "datafusionx-commercial.fullname" . }}-secret
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{ if .Values.externalPostgres.enabled }}
                  name: {{ required "externalPostgres.passwordSecret is required when externalPostgres.enabled=true" .Values.externalPostgres.passwordSecret | quote }}
                  key: {{ .Values.externalPostgres.passwordSecretKey | quote }}
                  {{ else }}
                  name: {{ include "datafusionx-commercial.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
                  {{ end }}
            - name: DATABASE_URL
              {{ if .Values.externalPostgres.enabled }}
              value: {{ printf "postgresql+asyncpg://%s:$(POSTGRES_PASSWORD)@%s:%v/%s" (required "externalPostgres.username is required when externalPostgres.enabled=true" .Values.externalPostgres.username) (required "externalPostgres.host is required when externalPostgres.enabled=true" .Values.externalPostgres.host) .Values.externalPostgres.port (required "externalPostgres.database is required when externalPostgres.enabled=true" .Values.externalPostgres.database) | quote }}
              {{ else }}
              value: postgresql+asyncpg://datafusionx:$(POSTGRES_PASSWORD)@{{ include "datafusionx-commercial.fullname" . }}-postgres:5432/datafusionx
              {{ end }}
            - name: REDIS_URL
              value: redis://{{ include "datafusionx-commercial.fullname" . }}-redis:6379/0
          volumeMounts:
            - name: licenses
              mountPath: /app/licenses
      volumes:
        - name: licenses
          persistentVolumeClaim:
            claimName: {{ include "datafusionx-commercial.fullname" . }}-licenses
---
