{{- $weakRuntimeSecret := "change-me-at-least-32-bytes" }}
{{- if or (not .Values.secrets.jwtSecretKey) (eq .Values.secrets.jwtSecretKey $weakRuntimeSecret) }}
{{- fail "secrets.jwtSecretKey 必须替换为 32 字节以上随机字符串，可用 openssl rand -base64 48 生成。" }}
{{- end }}
{{- if or (not .Values.secrets.encryptionSecretKey) (eq .Values.secrets.encryptionSecretKey $weakRuntimeSecret) }}
{{- fail "secrets.encryptionSecretKey 必须替换为 32 字节以上随机字符串，可用 openssl rand -base64 48 生成。" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datafusionx-commercial.fullname" . }}-secret
  labels:
    {{- include "datafusionx-commercial.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  JWT_SECRET_KEY_CURRENT: {{ .Values.secrets.jwtSecretKeyCurrent | quote }}
  JWT_SECRET_KEY_PREVIOUS: {{ .Values.secrets.jwtSecretKeyPrevious | quote }}
  ENCRYPTION_SECRET_KEY: {{ .Values.secrets.encryptionSecretKey | quote }}
  LICENSE_PUBLIC_KEY: {{ .Values.secrets.licensePublicKey | quote }}
  LICENSE_CUSTOMER_ID: {{ .Values.secrets.licenseCustomerId | quote }}
  LICENSE_DEPLOYMENT_ID: {{ .Values.secrets.licenseDeploymentId | quote }}
  COMMERCIAL_INTEGRITY_PUBLIC_KEY: {{ .Values.secrets.commercialIntegrityPublicKey | quote }}
  LDAP_BIND_PASSWORD: {{ .Values.secrets.ldapBindPassword | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  DINGTALK_LOGIN_APP_SECRET: {{ .Values.secrets.dingtalkAppSecret | quote }}
  FEISHU_APP_SECRET: {{ .Values.secrets.feishuAppSecret | quote }}
  WECOM_LOGIN_APP_SECRET: {{ .Values.secrets.wecomAppSecret | quote }}
