name: Release Version Record

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record Version
    runs-on: [self-hosted, Linux, ARM64, datafusionx-deploy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate release version record
        id: version
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          version="v0.1.0-${GITHUB_RUN_NUMBER}-${short_sha}"
          mkdir -p release-record
          cat > release-record/release-version.json <<JSON
          {
            "version": "${version}",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "runNumber": ${GITHUB_RUN_NUMBER},
            "runId": ${GITHUB_RUN_ID},
            "repository": "${GITHUB_REPOSITORY}"
          }
          JSON
          {
            echo "version=${version}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write summary
        run: |
          {
            echo "## DataFusionX-Deploy Release Version Record"
            echo ""
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Run: \`${{ github.run_id }}\`"
            echo ""
            echo "Artifacts are disabled unless ENABLE_RELEASE_VERSION_ARTIFACT is true."
          } >> "${GITHUB_STEP_SUMMARY}"
          cat release-record/release-version.json

      - name: Upload release version record
        if: ${{ vars.ENABLE_RELEASE_VERSION_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-version-${{ steps.version.outputs.short_sha }}
          path: release-record/release-version.json
          retention-days: 7
